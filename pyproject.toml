[project]
name = "copsens-boyi"
version = "0.1.0"
description = "Reproducible TE-PPO and baseline experiments for cooperative perception"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium",
    "matplotlib",
    "numpy",
    "psutil",
    "pyyaml",
    "stable-baselines3",
    # ``torch`` is imported directly by src/parallel.py, src/rl/{train,mappo,policy}.py;
    # listing it explicitly so we don't rely on SB3's transitive dependency (which
    # could be loosened in a future SB3 release).
    "torch",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".stale_paper_DO_NOT_REFER",
    "artifacts",
    "outputs",
    "paper",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# The backend/cache must be configured before pyplot and project modules import
# matplotlib transitively.
"scripts/tune_dbas_price.py" = ["E402"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
